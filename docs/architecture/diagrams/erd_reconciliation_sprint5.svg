<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="760" fill="white"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1B2A4A">ERD Reconciliation — as-designed (erd_v2.png) vs. as-implemented at runtime</text>
  <text x="20" y="48" font-size="12" fill="#555">Verified against src/api/state.py, src/api/db.py, db/migrations/001_initial_schema.sql — 26 Jul 2026</text>

  <!-- Legend -->
  <rect x="20" y="64" width="16" height="16" fill="#0D9488"/>
  <text x="42" y="77" font-size="12">Real at runtime (queried by current code)</text>
  <rect x="330" y="64" width="16" height="16" fill="#E7E9EC" stroke="#9AA1AC" stroke-dasharray="4,3"/>
  <text x="352" y="77" font-size="12">Designed in migration only — no code path queries it</text>
  <rect x="760" y="64" width="16" height="16" fill="#FBF3DE" stroke="#D4A843"/>
  <text x="782" y="77" font-size="12">Redesigned — real, but different shape than the migration</text>

  <!-- Designed-only cluster -->
  <g>
    <rect x="30" y="110" width="190" height="60" fill="#E7E9EC" stroke="#9AA1AC" stroke-dasharray="4,3" rx="4"/>
    <text x="125" y="132" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">users</text>
    <text x="125" y="150" font-size="10" text-anchor="middle" fill="#777">UUID id, role, password_hash</text>
    <text x="125" y="163" font-size="9.5" text-anchor="middle" fill="#9A6B00">actual: fixtures/sample_responses.json</text>

    <rect x="250" y="110" width="190" height="60" fill="#E7E9EC" stroke="#9AA1AC" stroke-dasharray="4,3" rx="4"/>
    <text x="345" y="132" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">courses</text>
    <text x="345" y="150" font-size="10" text-anchor="middle" fill="#777">UUID id, course_code, name</text>
    <text x="345" y="163" font-size="9.5" text-anchor="middle" fill="#9A6B00">actual: hardcoded/fixture list</text>

    <rect x="140" y="200" width="190" height="60" fill="#E7E9EC" stroke="#9AA1AC" stroke-dasharray="4,3" rx="4"/>
    <text x="235" y="222" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">course_memberships</text>
    <text x="235" y="240" font-size="10" text-anchor="middle" fill="#777">user_id, course_id, role</text>
    <text x="235" y="253" font-size="9.5" text-anchor="middle" fill="#9A6B00">actual: fixture enrolled_courses field</text>

    <rect x="30" y="290" width="190" height="60" fill="#E7E9EC" stroke="#9AA1AC" stroke-dasharray="4,3" rx="4"/>
    <text x="125" y="312" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">conversation_sessions</text>
    <text x="125" y="330" font-size="10" text-anchor="middle" fill="#777">UUID id, user_id, course_id</text>
    <text x="125" y="343" font-size="9.5" text-anchor="middle" fill="#9A6B00">actual: in-memory APIState dict</text>

    <rect x="250" y="290" width="190" height="60" fill="#E7E9EC" stroke="#9AA1AC" stroke-dasharray="4,3" rx="4"/>
    <text x="345" y="312" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">conversation_messages</text>
    <text x="345" y="330" font-size="10" text-anchor="middle" fill="#777">session_id, turn_index, text</text>
    <text x="345" y="343" font-size="9.5" text-anchor="middle" fill="#9A6B00">actual: in-memory, same dict</text>

    <rect x="30" y="380" width="190" height="55" fill="#E7E9EC" stroke="#9AA1AC" stroke-dasharray="4,3" rx="4"/>
    <text x="125" y="402" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">refresh_tokens</text>
    <text x="125" y="420" font-size="9.5" text-anchor="middle" fill="#9A6B00">actual: not implemented</text>

    <rect x="250" y="380" width="190" height="55" fill="#E7E9EC" stroke="#9AA1AC" stroke-dasharray="4,3" rx="4"/>
    <text x="345" y="402" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">audit_logs</text>
    <text x="345" y="420" font-size="9.5" text-anchor="middle" fill="#9A6B00">actual: not implemented</text>
  </g>
  <text x="235" y="95" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">Designed in Sprint 3 migration — 7 tables, 0 wired up</text>

  <!-- Redesigned / real cluster -->
  <g>
    <rect x="540" y="110" width="230" height="90" fill="#FBF3DE" stroke="#D4A843" rx="4"/>
    <text x="655" y="132" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B2A4A">documents (designed)</text>
    <text x="655" y="150" font-size="10" text-anchor="middle" fill="#555">UUID id, FK courses.id, stored_path,</text>
    <text x="655" y="163" font-size="10" text-anchor="middle" fill="#555">mime_type, sha256_checksum</text>
    <text x="655" y="182" font-size="10.5" text-anchor="middle" fill="#9A6B00" font-weight="bold">→ redesigned as:</text>

    <rect x="820" y="110" width="230" height="90" fill="#E6F5F3" stroke="#0D9488" rx="4"/>
    <text x="935" y="132" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B2A4A">uploaded_documents (real)</text>
    <text x="935" y="150" font-size="10" text-anchor="middle" fill="#333">TEXT document_id, loose</text>
    <text x="935" y="163" font-size="10" text-anchor="middle" fill="#333">course_id/course_code/course_uuid</text>
    <text x="935" y="180" font-size="9.5" text-anchor="middle" fill="#0D9488">src/api/db.py — no FK to courses</text>

    <line x1="770" y1="155" x2="820" y2="155" stroke="#9A6B00" stroke-width="2" marker-end="url(#arrY)"/>

    <rect x="540" y="230" width="230" height="90" fill="#FBF3DE" stroke="#D4A843" rx="4"/>
    <text x="655" y="252" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B2A4A">indexing_jobs (designed)</text>
    <text x="655" y="270" font-size="10" text-anchor="middle" fill="#555">UUID id, job_status, attempt_count,</text>
    <text x="655" y="283" font-size="10" text-anchor="middle" fill="#555">error_message, FK documents+courses</text>
    <text x="655" y="302" font-size="10.5" text-anchor="middle" fill="#9A6B00" font-weight="bold">→ redesigned as:</text>

    <rect x="820" y="230" width="230" height="90" fill="#E6F5F3" stroke="#0D9488" rx="4"/>
    <text x="935" y="252" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B2A4A">indexing_jobs (real)</text>
    <text x="935" y="270" font-size="10" text-anchor="middle" fill="#333">TEXT job_id, status, progress_percent,</text>
    <text x="935" y="283" font-size="10" text-anchor="middle" fill="#333">error, FK uploaded_documents only</text>
    <text x="935" y="300" font-size="9.5" text-anchor="middle" fill="#0D9488">src/api/db.py</text>

    <line x1="770" y1="275" x2="820" y2="275" stroke="#9A6B00" stroke-width="2" marker-end="url(#arrY)"/>

    <line x1="935" y1="200" x2="935" y2="230" stroke="#0D9488" stroke-width="2" marker-end="url(#arrT)"/>
    <text x="1000" y="218" font-size="9.5" fill="#0D9488">FK document_id</text>
  </g>
  <text x="770" y="95" font-size="13" font-weight="bold" fill="#1B2A4A" text-anchor="middle">Only slice actually wired to live Postgres (Sprint 5, QA-DATA-001)</text>

  <defs>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="#9A6B00"/></marker>
    <marker id="arrT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0L6,3L0,6Z" fill="#0D9488"/></marker>
  </defs>

  <rect x="30" y="470" width="1120" height="150" fill="#F4F6F9" stroke="#BFC7D1"/>
  <text x="45" y="494" font-size="13.5" font-weight="bold" fill="#1B2A4A">Bottom line</text>
  <text x="45" y="518" font-size="12" fill="#1A1A1A">2 of the 9 designed tables have a real (but redesigned, loosely-typed, non-FK-constrained) runtime equivalent. The other 7 —</text>
  <text x="45" y="538" font-size="12" fill="#1A1A1A">users, courses, course_memberships, conversation_sessions, conversation_messages, refresh_tokens, audit_logs — are defined in</text>
  <text x="45" y="558" font-size="12" fill="#1A1A1A">`db/migrations/001_initial_schema.sql` but are not queried anywhere in the running Sprint 5 API. Auth, courses, and chat history are</text>
  <text x="45" y="578" font-size="12" fill="#1A1A1A">still fixture/in-memory. System Design Document §11's claim that "PostgreSQL stores users, roles, courses... sessions, messages,</text>
  <text x="45" y="598" font-size="12" fill="#1A1A1A">refresh tokens, and audit logs" is not accurate for the current system and should be corrected before A4 submission.</text>
</svg>
