name: edurag

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    working_dir: /workspace
    command: ["python", "apps/integration/backend/api.py"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-edurag}
      POSTGRES_USER: ${POSTGRES_USER:-edurag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edurag_dev_password}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-llama3.2}
      DEFAULT_OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-qwen3:14b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYTHONPATH: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - ./:/workspace
      - uploads_data:/workspace/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - edurag-net

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    working_dir: /workspace
    command:
      - streamlit
      - run
      - apps/streamlit/main.py
      - --server.port
      - "8501"
      - --server.address
      - "0.0.0.0"
      - --server.headless
      - "true"
      - --server.enableCORS
      - "false"
      - --browser.gatherUsageStats
      - "false"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PAEDIA_API_URL: http://api:5000
      PAEDIA_USE_FIXTURES: ${PAEDIA_USE_FIXTURES:-false}
      PAEDIA_API_TIMEOUT: ${PAEDIA_API_TIMEOUT:-10}
      PAEDIA_API_RETRIES: ${PAEDIA_API_RETRIES:-2}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - ./:/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - edurag-net

  app:
    image: python:3.11-slim
    working_dir: /workspace
    profiles:
      - tools
    command: ["sh", "-lc", "echo 'EduRAG tools container ready'; tail -f /dev/null"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-edurag}
      POSTGRES_USER: ${POSTGRES_USER:-edurag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edurag_dev_password}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-llama3.2}
      DEFAULT_OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-qwen3:14b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./:/workspace
      - uploads_data:/workspace/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - edurag-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edurag}
      POSTGRES_USER: ${POSTGRES_USER:-edurag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edurag_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edurag} -d ${POSTGRES_DB:-edurag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edurag-net

  chromadb:
    image: chromadb/chroma@sha256:607103123fbd79794e3cd8029e16137031a464551e3a61df77191627a9d23c72
    environment:
      IS_PERSISTENT: "TRUE"
      # This image persists to /data, not the /chroma/chroma path used by
      # older chromadb releases. Stated explicitly so the volume mount below
      # can never silently drift away from where the data actually lands.
      PERSIST_DIRECTORY: /data
      CHROMA_SERVER_HTTP_PORT: 8000
      ALLOW_RESET: "TRUE"
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chromadb_data:/data
    networks:
      - edurag-net

  ollama:
    image: ollama/ollama@sha256:d3d553bdfbcc7f55dd5ddf42c4cbe3a927aa9bb1802710d35e94656ca5aea02b
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - edurag-net

networks:
  edurag-net:
    driver: bridge

volumes:
  uploads_data:
  postgres_data:
  chromadb_data:
  ollama_data:
