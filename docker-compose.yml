name: edurag

services:
  api:
    # T9-12: the host rebooted twice in early September and the stack never
    # came back - the app sat dead until somebody noticed. This is a 24/7
    # shared instance behind Tailscale, so it has to come up with the
    # machine. 'unless-stopped' rather than 'always', so a deliberate
    # 'docker compose stop' stays stopped.
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    working_dir: /workspace
    # Gunicorn replaces the Flask dev server for the shared host.
    # --workers=2 lets two people query at once; --timeout=300 is longer
    # than Ollama's own 240s limit so slow answers aren't killed mid-generation.
    command: [
      "gunicorn",
      "--bind=0.0.0.0:5000",
      "--workers=2",
      "--threads=4",
      "--timeout=300",
      "--access-logfile=-",
      "src.api.wsgi:app",
    ]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PAEDIA_USE_FIXTURES: ${PAEDIA_USE_FIXTURES:-false}
      PORT: 5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-edurag}
      POSTGRES_USER: ${POSTGRES_USER:-edurag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edurag_dev_password}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      OLLAMA_HOST: http://ollama:11434
      # Both names, same fallback, on purpose: the pipeline reads OLLAMA_MODEL
      # and warmup reads DEFAULT_OLLAMA_MODEL. They used to fall back to
      # different models, so a stack started without a .env warmed one model
      # into VRAM and then asked Ollama for a different one on every query.
      OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-gemma4:12b}
      DEFAULT_OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-gemma4:12b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # After a reboot Docker starts every container at once and ignores
      # depends_on, so the API can start before Postgres accepts connections.
      # Wait up to this long, then exit and let the restart policy retry,
      # rather than run a worker with no database that refuses every login
      # while /api/health still says ok (T9-12).
      PAEDIA_DB_STARTUP_TIMEOUT_SECONDS: ${PAEDIA_DB_STARTUP_TIMEOUT_SECONDS:-120}
      # Browser origin allowed to call this API directly. Streamlit talks to it
      # server-side so the UI does not depend on this, but anything calling the
      # API from a browser does. Defaults to the local Streamlit port.
      PAEDIA_ALLOWED_ORIGIN: ${PAEDIA_ALLOWED_ORIGIN:-http://localhost:8501}
      # Demo account passwords, seeded into Postgres on startup. Empty means
      # db.py falls back to its published defaults - fine locally, not on a
      # shared host.
      PAEDIA_DEMO_ADMIN_PASSWORD: ${PAEDIA_DEMO_ADMIN_PASSWORD:-}
      PAEDIA_DEMO_LECTURER_PASSWORD: ${PAEDIA_DEMO_LECTURER_PASSWORD:-}
      PAEDIA_DEMO_STUDENT_PASSWORD: ${PAEDIA_DEMO_STUDENT_PASSWORD:-}
      # Generation settings. These were only readable inside the container, so
      # tuning them meant editing the image rather than .env (T8-17).
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-700}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P:-0.9}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      TOP_K: ${TOP_K:-5}
      PROMPT_STRATEGY: ${PROMPT_STRATEGY:-evidence_cited}
      # The all-MiniLM-L6-v2 cache under models/ is complete, so never reach
      # for the Hub at startup. A transient network blip there makes
      # sentence-transformers fall back to the FNV-1a hash embedder for the
      # life of the process: the corpus stays embedded with the real model,
      # queries are not, retrieval collapses, and /api/health still says ok.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      PYTHONPATH: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    ports:
      - "${PAEDIA_BIND_ADDR:-127.0.0.1}:${API_PORT:-5000}:5000"
    volumes:
      - ./:/workspace
      - uploads_data:/workspace/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - edurag-net

  streamlit:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    working_dir: /workspace
    command:
      - streamlit
      - run
      - apps/streamlit/main.py
      - --server.port
      - "8501"
      - --server.address
      - "0.0.0.0"
      - --server.headless
      - "true"
      - --server.enableCORS
      - "false"
      - --browser.gatherUsageStats
      - "false"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PAEDIA_API_URL: http://api:5000
      PAEDIA_USE_FIXTURES: ${PAEDIA_USE_FIXTURES:-false}
      PAEDIA_API_TIMEOUT: ${PAEDIA_API_TIMEOUT:-10}
      PAEDIA_API_RETRIES: ${PAEDIA_API_RETRIES:-2}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PAEDIA_BIND_ADDR:-127.0.0.1}:${APP_PORT:-8501}:8501"
    volumes:
      - ./:/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - edurag-net

  app:
    image: python:3.11-slim
    working_dir: /workspace
    profiles:
      - tools
    command: ["sh", "-lc", "echo 'EduRAG tools container ready'; tail -f /dev/null"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-edurag}
      POSTGRES_USER: ${POSTGRES_USER:-edurag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edurag_dev_password}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-gemma4:12b}
      DEFAULT_OLLAMA_MODEL: ${DEFAULT_OLLAMA_MODEL:-gemma4:12b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./:/workspace
      - uploads_data:/workspace/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    networks:
      - edurag-net

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edurag}
      POSTGRES_USER: ${POSTGRES_USER:-edurag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edurag_dev_password}
    ports:
      # Nothing outside this host needs the database: api and streamlit reach
      # it over the compose network. Kept off PAEDIA_BIND_ADDR so putting the
      # UI on the tailnet does not put Postgres there too.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edurag} -d ${POSTGRES_DB:-edurag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edurag-net

  chromadb:
    restart: unless-stopped
    image: chromadb/chroma@sha256:607103123fbd79794e3cd8029e16137031a464551e3a61df77191627a9d23c72
    environment:
      IS_PERSISTENT: "TRUE"
      # This image persists to /data, not the /chroma/chroma path used by
      # older chromadb releases. Stated explicitly so the volume mount below
      # can never silently drift away from where the data actually lands.
      PERSIST_DIRECTORY: /data
      CHROMA_SERVER_HTTP_PORT: 8000
      ALLOW_RESET: "FALSE"
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8000}:8000"
    volumes:
      - chromadb_data:/data
    networks:
      - edurag-net

  ollama:
    restart: unless-stopped
    # ollama/ollama:0.34.0, pinned by digest so every machine runs the same
    # build. Was 0.21.0, which is too old for the models the team wants to
    # compare against qwen3:14b. Pulled models live in the ollama_data volume
    # below, so changing the image does not re-download them.
    image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      # Ollama sizes its KV cache as num_ctx x num_parallel. Left unset it
      # allocates one slot, so the host answers one question at a time and
      # everybody else queues - which is the wrong shape for a class demo.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - edurag-net

networks:
  edurag-net:
    driver: bridge

volumes:
  uploads_data:
  postgres_data:
  chromadb_data:
  ollama_data:
