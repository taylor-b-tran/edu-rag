name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  python-test:
    name: Python tests and fixture validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt deliberately doesn't pin torch (see the comment
          # there) so teammates can install a CPU, CUDA, or lab-image build
          # to match their own machine. On this runner there's no GPU and,
          # as of the current torch release, `pip install torch` with no
          # index hint resolves the default PyPI wheel, which pulls in the
          # full CUDA 13 stack as separate nvidia-*-cu13 packages (cuBLAS,
          # cuDNN, cuSPARSE, cuFFT, cuSOLVER, NCCL, Triton, etc. - several GB
          # combined). That's what was blowing past this runner's ~14GB free
          # disk with "OSError: [Errno 28] No space left on device" before
          # sentence-transformers or anything else got installed. Installing
          # the CPU-only build first satisfies sentence-transformers'
          # `torch>=1.11.0` dependency directly, so pip never reaches for
          # the CUDA build afterwards.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: Compile runtime modules
        run: |
          python -m py_compile \
            src/api/app.py \
            apps/integration/backend/api.py \
            apps/streamlit/main.py \
            src/document_processor/chunker.py \
            src/document_processor/ingest_corpus.py \
            src/document_processor/offline_embedder.py

      - name: Validate JSON artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # T9-18 (corrects T8-12): docs/rag_config_benchmark_2026-04-22.json
          # and docs/rag_config_benchmark_31q.json ARE in the repo - they've
          # been committed since April/May 2026. The T8-12 note above used to
          # say they didn't exist "anywhere in the repo"; that was checked
          # against an exported zip, not a git checkout. Both files are
          # marked `export-ignore` in .gitattributes (see the "Sprint 3/4/5
          # internal working docs, out of scope for A4" block), which trims
          # them out of `git archive`/zip exports only. `actions/checkout@v4`
          # above does a normal clone, which export-ignore does not affect,
          # so both files are present when this step actually runs in CI.
          # docs/retrieval_benchmark_sprint7.json and
          # docs/retrieval_benchmark_sprint8.json are the current, in-scope
          # retrieval benchmarks and are validated alongside them below.
          paths = [
              Path("fixtures/sample_responses.json"),
              Path("tests/test_queries.json"),
              Path("docs/rag_config_benchmark_2026-04-22.json"),
              Path("docs/rag_config_benchmark_31q.json"),
              Path("docs/retrieval_benchmark_sprint7.json"),
              Path("docs/retrieval_benchmark_sprint8.json"),
          ]
          for path in paths:
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(f"valid json: {path}")
          PY

      - name: Run Sprint 5 integration gate
        run: python scripts/sprint5_integration_gate.py

      - name: Run pytest
        run: python -m pytest -q

  docker-compose-validate:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate base Compose file
        run: docker compose -f docker-compose.yml config

      - name: Validate GPU Compose overlay
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config

      - name: Validate Sprint 5 demo service contract
        run: |
          docker compose -f docker-compose.yml config --format json > compose.json
          python3 scripts/sprint5_integration_gate.py --compose-json compose.json