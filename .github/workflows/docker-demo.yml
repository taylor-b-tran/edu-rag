name: Docker Demo Readiness

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "docker-compose.yml"
      - "docker-compose.gpu.yml"
      - "docker/**"
      - ".env.example"
      - "requirements.txt"
      - "README_docker.md"
      - ".github/workflows/docker-demo.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "docker-compose.yml"
      - "docker-compose.gpu.yml"
      - "docker/**"
      - ".env.example"
      - "requirements.txt"
      - "README_docker.md"
      - ".github/workflows/docker-demo.yml"

permissions:
  contents: read

jobs:
  demo-infra-smoke:
    name: Demo stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Compose bundle
        run: docker compose -f docker-compose.yml config

      - name: Validate Sprint 5 demo service contract
        run: |
          docker compose -f docker-compose.yml config --format json > compose.json
          python3 scripts/sprint5_integration_gate.py --compose-json compose.json

      - name: Build and start demo services
        run: docker compose up -d --build postgres chromadb ollama api streamlit

      - name: Wait for PostgreSQL readiness
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U edurag -d edurag; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Smoke-test ChromaDB heartbeat
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/v2/heartbeat; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs chromadb
          exit 1

      - name: Smoke-test Ollama service API
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:11434/api/tags; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs ollama
          exit 1

      - name: Smoke-test Flask API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Smoke-test Streamlit health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs streamlit
          exit 1

      - name: Smoke-test tools container
        run: docker compose --profile tools run --rm --no-deps app python --version

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Tear down demo services
        if: always()
        run: docker compose --profile tools down -v --remove-orphans
