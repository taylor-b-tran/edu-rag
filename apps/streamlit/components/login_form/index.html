<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f9fa;
      color: #1b2a4a;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      color: #334155;
      font-size: 0.9rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      min-height: 2.75rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #1b2a4a;
      font: inherit;
      outline: none;
      padding: 0.55rem 0.75rem;
    }

    input:focus {
      border-color: #0d9488;
      box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.15);
    }

    button {
      width: 100%;
      min-height: 2.75rem;
      margin-top: 0.25rem;
      border: 1px solid #0d9488;
      border-radius: 8px;
      background: #0d9488;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    button:hover,
    button:focus {
      background: #0a7a70;
      border-color: #0a7a70;
      outline: none;
    }
  </style>
</head>
<body>
  <form id="login-form" autocomplete="on">
    <div>
      <label for="email">Email Address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required />
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
    </div>
    <button type="submit">Sign In</button>
  </form>

  <script>
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const form = document.getElementById("login-form");

    function sendMessage(type, data) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }

    function setFrameHeight() {
      sendMessage("streamlit:setFrameHeight", { height: document.body.scrollHeight });
    }

    function setComponentValue(value) {
      sendMessage("streamlit:setComponentValue", { value, dataType: "json" });
    }

    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type !== "streamlit:render") return;
      const args = data.args || {};
      if (args.default_email && !emailInput.value) {
        emailInput.value = args.default_email;
      }
      setFrameHeight();
    });

    function submitLogin() {
      setComponentValue({
        submitted: true,
        email: emailInput.value.trim(),
        password: passwordInput.value,
        nonce: `${Date.now()}-${Math.random().toString(16).slice(2)}`
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submitLogin();
    });

    [emailInput, passwordInput].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          submitLogin();
        }
      });
    });

    sendMessage("streamlit:componentReady", { apiVersion: 1 });
    setFrameHeight();
  </script>
</body>
</html>
