# Streamlit configuration for Paedia
# Forces light theme to prevent browser dark mode from overriding UI visibility

[theme]
primaryColor = "#0D9488"
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
font = "sans serif"

[server]
headless = true
enableCORS = false

[browser]
gatherUsageStats = false
